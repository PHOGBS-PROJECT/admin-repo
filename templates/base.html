{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PHOGBS{% endblock %} · PHOGBS</title>
  <link rel="icon" type="image/png" href="{% static 'img/phogbs-crest.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  {% block styles %}<link rel="stylesheet" href="{% static 'css/auth.css' %}">{% endblock %}
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  {% block scripts %}<script src="{% static 'js/auth.js' %}" defer></script>{% endblock %}
</body>
</html>
