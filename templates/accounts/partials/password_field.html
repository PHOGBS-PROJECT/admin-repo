{% load auth_forms %}{% comment %}Password input with show/hide toggle. Pass `field`, optionally `label`.{% endcomment %}
<div class="field">
  <label class="field-label" for="{{ field.id_for_label }}">{{ label|default:field.label }}</label>
  <div class="password-input">
    {% widget field %}
    <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" aria-controls="{{ field.id_for_label }}" aria-pressed="false">
      <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.2 3.2M6.6 6.6C3.6 8.5 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.7-1.3M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg>
    </button>
  </div>
  {% for error in field.errors %}<p class="field-error" id="{{ field.auto_id }}_error">{{ error }}</p>{% endfor %}
</div>
