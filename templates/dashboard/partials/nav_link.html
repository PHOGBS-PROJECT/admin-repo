{% comment %}Sidebar link. Pass url, icon, label; optional sub (true for submenu items) and key (highlighted when it equals the page's nav_active).{% endcomment %}<li><a class="nav-link{% if sub %} nav-link--sub{% endif %}{% if request.path == url or key and key == nav_active %} is-active{% endif %}" href="{{ url }}"{% if request.path == url or key and key == nav_active %} aria-current="page"{% endif %}>{% if not sub %}{% include "dashboard/partials/icon.html" with name=icon %}{% endif %}<span class="nav-label">{{ label }}</span></a></li>
